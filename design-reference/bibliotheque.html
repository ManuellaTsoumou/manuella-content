<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manuella Content — La Bibliothèque</title>
<meta name="theme-color" content="#6E1423">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6F1; --surface:#FFFFFF; --surface-2:#FFFFFF; --ink:#1E0B10; --muted:#75585C; --line:#EADCD6;
  --bordeaux:#6E1423; --bordeaux-deep:#2A0710; --blush:#F3E2DF; --gold:#E9C98F; --gold-deep:#C9A66B; --cream:#FBF3EA;
  --nav-bg:rgba(250,246,241,.82); --blob-1:rgba(110,20,35,.09); --blob-2:rgba(233,201,143,.22); --blob-3:rgba(176,42,68,.07);
  --serif:'Bodoni Moda', 'Didot', 'Bodoni 72', 'Times New Roman', Georgia, serif;
  --sans:'Jost', 'Futura', 'Century Gothic', 'Segoe UI', system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#150609; --surface:#211013; --surface-2:#211013; --ink:#FBF3EA; --muted:#C9B3B1; --line:#3A2226;
    --nav-bg:rgba(21,6,9,.84); --blob-1:rgba(110,20,35,.35); --blob-2:rgba(233,201,143,.08); --blob-3:rgba(176,42,68,.2);
  }
}
:root[data-theme="dark"]{
  --bg:#150609; --surface:#211013; --surface-2:#211013; --ink:#FBF3EA; --muted:#C9B3B1; --line:#3A2226;
  --nav-bg:rgba(21,6,9,.84); --blob-1:rgba(110,20,35,.35); --blob-2:rgba(233,201,143,.08); --blob-3:rgba(176,42,68,.2);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.serif{font-family:var(--serif)}

/* ---------- Fond vivant ---------- */
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);will-change:transform}
.b1{width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:var(--blob-1);animation:drift1 22s ease-in-out infinite alternate}
.b2{width:55vmax;height:55vmax;right:-25vmax;top:20vh;background:var(--blob-2);animation:drift2 26s ease-in-out infinite alternate}
.b3{width:50vmax;height:50vmax;left:-10vmax;bottom:-30vmax;background:var(--blob-3);animation:drift1 30s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(12vmax,10vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-14vmax,-8vmax) scale(.9)}}
#dust{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* ---------- Grain ---------- */
.grain{position:relative;isolation:isolate}
.grain::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;opacity:.28;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- Mise en page ---------- */
.app{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:18px 16px 140px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.me{display:flex;align-items:center;gap:12px}
.ring{width:54px;height:54px;border-radius:50%;padding:3px;background:conic-gradient(var(--gold),var(--bordeaux),var(--gold-deep),#B02A44,var(--gold));animation:spin 8s linear infinite;flex:none}
.ring > span{display:flex;width:100%;height:100%;border-radius:50%;border:2px solid var(--bg);background:linear-gradient(145deg,#8C1D30,#3E0A14);color:var(--gold);align-items:center;justify-content:center;font-family:var(--serif);font-size:24px;font-weight:400;font-style:italic;animation:spin 8s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.hello small{display:block;font-size:13px;color:var(--muted)}
.hello strong{display:block;font-family:var(--serif);font-size:21px;font-weight:500;font-style:italic;line-height:1.15}
.icon-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;transition:transform .2s}
.icon-btn:active{transform:scale(.92)}
.dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--surface)}

.cover{position:relative;overflow:hidden;color:#FBF3EA;margin:calc(-18px - env(safe-area-inset-top,0px)) -16px 0;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 28px;border-radius:0 0 34px 34px;
  background:radial-gradient(120% 80% at 100% 0%,#A3304A 0%,rgba(163,48,74,0) 55%),radial-gradient(100% 80% at 0% 100%,#3A0912 0%,rgba(58,9,18,0) 60%),#6E1423;
  --ink:#FBF3EA; --muted:#EBCFCA; --surface:rgba(251,243,234,.1); --line:rgba(251,243,234,.22); --bg:#6E1423;
  box-shadow:0 24px 50px rgba(74,13,23,.25)}
.cover > *{position:relative;z-index:2}
@media (min-width:700px){.cover{margin:0;border-radius:34px;padding:24px 32px 34px}}
@media (max-width:360px){.app{padding-left:12px;padding-right:12px}.cover{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}}
@media (min-width:700px){.controls.after-cover{flex-direction:row}.controls.after-cover .surprise{flex:1}}
.after-cover{margin-top:18px}
.hero{padding:30px 2px 6px}
.title{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(38px,12.4vw,118px);overflow-wrap:break-word;line-height:.92;letter-spacing:-.025em}
.title em{display:block;font-style:italic;font-weight:400;color:#FFFFFF}
.cover .title{color:#FFFFFF}
.cover .search input{color:#FBF3EA}
:root[data-theme="dark"] .title em{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .title em{color:var(--gold)}}
.mask{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .02em .08em}
.ch{display:inline-block;will-change:transform}
.meta{margin:14px 0 0;color:var(--muted);font-size:15px}
.meta b{color:var(--ink);font-weight:600}

.controls{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.search{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;transition:border-color .25s, box-shadow .25s}
.search:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px rgba(233,201,143,.18)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);height:52px;outline:none}
.search input::placeholder{color:var(--muted)}
@media (min-width:900px){.cover .controls{flex-direction:row;align-items:center}.cover .search{flex:1}}
.pills{position:relative;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;width:max-content;max-width:100%}
.pills::-webkit-scrollbar{display:none}
.pill-ind{position:absolute;top:4px;left:0;height:calc(100% - 8px);border-radius:999px;background:var(--ink);z-index:0}
.pill{position:relative;z-index:1;border:0;background:transparent;min-height:44px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:400;letter-spacing:.02em;white-space:nowrap;color:var(--ink);transition:color .3s}
.pill[aria-pressed="true"]{color:var(--bg)}

.surprise{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:14px;border:0;border-radius:22px;padding:0 20px;min-height:72px;background:radial-gradient(120% 120% at 100% 0%,#A3304A 0%,rgba(163,48,74,0) 60%),#6E1423;color:var(--cream);box-shadow:inset 0 0 0 1px rgba(233,201,143,.3),0 14px 30px rgba(110,20,35,.28);text-align:left;transition:transform .25s}
.surprise:hover{transform:translateY(-2px)}
.surprise:active{transform:scale(.98)}
.surprise .s-l{display:flex;align-items:center;gap:14px}
.surprise b{display:block;font-family:var(--serif);font-size:22px;font-weight:500;font-style:italic;line-height:1.1}
.surprise small{display:block;font-size:13px;color:#E2C9C4;margin-top:3px}
.mini-deck{position:relative;width:34px;height:42px;flex:none}
.mini-deck i{position:absolute;inset:0;border-radius:6px;border:1.5px solid var(--gold);background:#6E1423}
.mini-deck i:nth-child(1){transform:rotate(-12deg) translateX(-4px)}
.mini-deck i:nth-child(2){transform:rotate(6deg) translateX(3px)}
.surprise:hover .mini-deck i:nth-child(1){transform:rotate(-20deg) translateX(-8px)}
.surprise:hover .mini-deck i:nth-child(2){transform:rotate(14deg) translateX(6px)}
.mini-deck i{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.shimmer::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(233,201,143,.35) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.6s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* ---------- Grille bento ---------- */
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin:34px 2px 14px}
.section-head h2{margin:0;font-family:var(--serif);font-size:27px;font-weight:500}
.section-head span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:124px;grid-auto-flow:dense;gap:10px}
@media (max-width:360px){.grid{grid-auto-rows:112px;gap:8px}.tile{padding:13px;border-radius:22px}}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:150px;gap:12px}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:165px;gap:14px}}
.size-big{grid-column:span 2;grid-row:span 2}
.size-wide{grid-column:span 2}
.size-tall{grid-row:span 2}

.tile{position:relative;overflow:hidden;border:0;border-radius:26px;padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;min-width:0;transform-style:preserve-3d;will-change:transform}
.tile::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,248,235,.24),transparent 60%)}
.tile:hover::before,.tile:focus-visible::before,.tile.pressing::before{opacity:1}
.tile:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.t-top,.t-bottom{position:relative;z-index:3;display:flex;flex-direction:column;gap:6px}
.t-top{flex-direction:row;justify-content:space-between;align-items:flex-start}
.t-pillar{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.t-chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--chip)}
.t-name{font-family:var(--serif);font-weight:500;line-height:1;letter-spacing:-.015em;font-size:clamp(17px,5.4vw,22px);overflow-wrap:break-word;hyphens:auto}
.size-tall .t-name,.size-wide .t-name{font-size:clamp(23px,7vw,30px)}
.size-big .t-name{font-size:clamp(46px,12vw,76px);font-style:italic;font-weight:400}
.t-next{font-size:12.5px;color:var(--sub);max-width:90%}
.t-num{position:absolute;right:-4px;bottom:-26px;z-index:0;font-family:var(--serif);font-weight:400;font-style:italic;line-height:1;font-size:120px;color:transparent;-webkit-text-stroke:1px var(--deco);pointer-events:none}
.size-big .t-num{font-size:230px;bottom:-50px}
.t-arrow{position:absolute;z-index:3;right:14px;bottom:14px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--chip);opacity:0;transform:translateY(6px);transition:opacity .3s, transform .3s}
.tile:hover .t-arrow{opacity:1;transform:none}

.art-soin{background:radial-gradient(120% 90% at 90% 0%,#A3304A 0%,rgba(163,48,74,0) 55%),radial-gradient(90% 80% at 0% 100%,#3A0812 0%,rgba(58,8,18,0) 60%),#6E1423;color:#FBF3EA;--sub:#F0D6CF;--deco:rgba(251,243,234,.2);--chip:rgba(251,243,234,.16)}
.art-mental{background:radial-gradient(100% 80% at 85% 0%,#561526 0%,rgba(86,21,38,0) 60%),radial-gradient(90% 80% at 0% 100%,#0E0204 0%,rgba(14,2,4,0) 60%),#2A0710;color:#FBF3EA;--sub:#E2C9C4;--deco:rgba(233,201,143,.3);--chip:rgba(251,243,234,.12);box-shadow:inset 0 0 0 1px rgba(233,201,143,.2)}
.art-evoluer{background:radial-gradient(100% 80% at 90% 0%,#FFF6F3 0%,rgba(255,246,243,0) 55%),radial-gradient(90% 90% at 0% 100%,#E9C9C4 0%,rgba(233,201,196,0) 60%),#F3E2DF;color:#4A0D17;--sub:#7A2E3B;--deco:rgba(110,20,35,.18);--chip:rgba(110,20,35,.08);box-shadow:inset 0 0 0 1px rgba(110,20,35,.1)}

.empty{text-align:center;padding:50px 20px}
.empty h3{margin:0;font-family:var(--serif);font-size:28px;font-weight:500;font-style:italic}
.empty p{margin:8px 0 0;color:var(--muted)}

/* ---------- Navigation ---------- */
.nav{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;display:flex;justify-content:space-between;padding:6px;border-radius:26px;background:var(--nav-bg);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:0 18px 40px rgba(23,14,16,.16)}
@media (max-width:360px){.nav{left:8px;right:8px}.nav button{font-size:10px}}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;border:0;background:transparent;border-radius:20px;font-size:11px;color:var(--muted);transition:background .25s,color .25s}
.nav button[aria-current="page"]{background:var(--bordeaux);color:var(--cream);font-weight:600}

/* ---------- Toast ---------- */
.toast{position:fixed;z-index:80;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);width:max-content;padding:14px 18px;border-radius:18px;background:#170E10;color:var(--cream);font-size:14px;box-shadow:0 18px 40px rgba(0,0,0,.3);transition:opacity .35s,transform .35s cubic-bezier(.2,.8,.2,1)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Détail d'un thème ---------- */
.detail{position:fixed;inset:0;z-index:50;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.detail[hidden]{display:none}
.d-top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px}
.d-back,.d-close{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 18px 0 14px;border-radius:999px;border:0;background:var(--chip);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:14px;font-weight:500}
.d-inner{max-width:760px;margin:0 auto}
.d-hero{position:relative;padding:20px clamp(18px,5vw,40px) 34px;overflow:hidden;min-height:46vh;display:flex;flex-direction:column;justify-content:flex-end;gap:16px}
.d-num{position:absolute;right:-10px;top:-40px;font-family:var(--serif);font-weight:400;font-style:italic;font-size:min(70vw,420px);line-height:1;color:transparent;-webkit-text-stroke:1px var(--deco);pointer-events:none}
.d-pillar{position:relative;margin:0;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}
.d-title{position:relative;margin:0;font-family:var(--serif);font-weight:400;font-style:italic;font-size:clamp(40px,12vw,100px);overflow-wrap:break-word;line-height:.95;letter-spacing:-.02em}
.d-prog{position:relative;display:flex;flex-direction:column;gap:8px;max-width:420px}
.d-prog-text{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.d-bar{height:6px;border-radius:999px;background:var(--chip);overflow:hidden}
.d-bar span{display:block;height:100%;width:0;border-radius:999px;background:var(--gold)}
.art-evoluer .d-bar span{background:#6E1423}
.d-ai{position:relative;overflow:hidden;align-self:flex-start;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 20px;border-radius:16px;border:0;background:#170E10;color:var(--cream);font-size:15px;font-weight:600}
.d-sheet{position:relative;background:var(--bg);color:var(--ink);border-radius:32px 32px 0 0;padding:26px clamp(14px,4vw,32px) calc(60px + env(safe-area-inset-bottom,0px));min-height:60vh}
.d-sheet-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 16px}
.d-sheet-head h3{margin:0;font-family:var(--serif);font-size:28px;font-weight:500}
.d-sheet-head span{font-size:13px;color:var(--muted)}
.d-list{display:grid;gap:12px}
@media (min-width:700px){.d-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.s-card{background:var(--surface-2);border:1px solid var(--line);box-shadow:0 6px 20px rgba(74,13,23,.05);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.s-chips{display:flex;gap:8px;flex-wrap:wrap}
.s-status,.s-format{font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px}
.st-pub{background:var(--bordeaux);color:var(--cream)}
.st-plan{background:var(--blush);color:var(--bordeaux)}
.st-todo{border:1px solid var(--line);color:var(--muted);font-weight:500}
.s-format{background:rgba(110,20,35,.06);color:var(--bordeaux);font-weight:500}
.s-title{margin:0;font-family:var(--serif);font-size:23px;line-height:1.15;font-weight:500}
.s-actions{display:flex;gap:8px;margin-top:auto}
.s-actions button{flex:1;min-height:46px;border-radius:14px;font-size:14px;font-weight:500;transition:transform .2s,background .25s}
.s-actions button:active{transform:scale(.96)}
.s-plan{border:1px solid var(--line);background:transparent;color:var(--ink)}
.s-plan.done{background:var(--blush);border-color:var(--blush);color:var(--bordeaux);font-weight:600}
.s-ai{flex:1.4 !important;border:0;background:var(--bordeaux);color:var(--cream);font-weight:600 !important}
.d-more{text-align:center;color:var(--muted);font-size:13px;margin:18px 0 0}

/* ---------- Paquet de cartes ---------- */
.deck{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));background:rgba(14,8,10,.84);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.deck[hidden]{display:none}
.deck-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:48px;height:48px;border-radius:50%;border:1px solid rgba(251,243,234,.2);background:rgba(251,243,234,.08);color:var(--cream);display:grid;place-items:center}
.deck-hint{margin:0;color:#D8C9C4;font-size:14px;letter-spacing:.04em;min-height:20px}
.stage{position:relative;width:min(300px,74vw,calc((100vh - 230px) * .73));width:min(300px,74vw,calc((100dvh - 230px) * .73));min-width:170px;aspect-ratio:3/4.1;perspective:1300px}
@media (max-height:560px){.deck{gap:12px}.front{padding:16px}.front .f-title{font-size:22px}}
.card{position:absolute;inset:0}
.card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:26px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 26px 50px rgba(0,0,0,.4)}
.back{background:radial-gradient(90% 70% at 80% 0%,#B02A44,rgba(176,42,68,0) 60%),radial-gradient(90% 80% at 0 100%,#2B060E,rgba(43,6,14,0) 60%),#6E1423;display:grid;place-items:center}
.back::before{content:"";position:absolute;inset:12px;border-radius:18px;border:1px solid rgba(233,201,143,.55)}
.back .mono{font-family:var(--serif);font-size:84px;font-weight:400;font-style:italic;color:var(--gold);line-height:1}

.front .f-label{position:relative;z-index:2;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--sub)}

.btn-ghost{border:1px solid rgba(251,243,234,.35);background:transparent;color:var(--cream)}
.btn-gold{border:0;background:var(--gold);color:#2A1A12;flex:1.25 !important}

/* ---------- Intro ---------- */
.intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--cream);
  background:radial-gradient(100% 70% at 80% 0%,#B02A44,rgba(176,42,68,0) 60%),radial-gradient(90% 70% at 0 100%,#2B060E,rgba(43,6,14,0) 60%),#6E1423}
.intro .ring{width:96px;height:96px;margin-bottom:14px}
.intro .ring > span{font-size:42px;border-color:#6E1423}
.intro-hello{margin:0;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#F0D6CF}

.intro-sub{margin:6px 0 0;font-size:16px;color:#F0D6CF}
.intro-skip{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));border:0;background:transparent;color:#F0D6CF;font-size:13px;min-height:44px;padding:0 16px;text-decoration:underline;text-underline-offset:4px}

/* ---------- Léopard : touches décoratives uniquement ---------- */
.leo-ribbon{display:flex;align-items:center;gap:12px;margin-top:16px}
.leo-ribbon .band{height:7px;width:84px;border-radius:999px;background-color:#B9894A;background-image:var(--leo-text);background-size:70px 70px;box-shadow:inset 0 0 0 1px rgba(42,26,18,.15)}
.leo-ribbon .line{height:1px;flex:0 0 46px;background:var(--line)}
.leo-ribbon .gem{width:7px;height:7px;transform:rotate(45deg);background:var(--gold)}
.back .leo-frame{position:absolute;inset:0;z-index:0;background-color:#3E0A14;background-image:var(--leo-gold);background-size:110px 110px}
.back .panel{position:absolute;inset:11px;z-index:0;border-radius:18px;background:radial-gradient(90% 70% at 80% 0%,#B02A44,rgba(176,42,68,0) 60%),radial-gradient(90% 80% at 0 100%,#2B060E,rgba(43,6,14,0) 60%),#6E1423;box-shadow:0 0 0 1px rgba(233,201,143,.7)}
.back .mono,.back .brand{position:relative;z-index:2}
.back .brand{position:absolute}
.back::before{inset:20px;z-index:1;border-color:rgba(233,201,143,.35)}
.surprise .mini-deck i{background-color:#3E0A14;background-image:var(--leo-gold);background-size:40px 40px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js"></script>

<script>
(function(){
"use strict";

/* ---------------- Outils ---------------- */
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var G = window.gsap || null;
var HAS_FLIP = !!(G && window.Flip);
if (HAS_FLIP) G.registerPlugin(window.Flip);
var dur = function(x){ return RM ? 0 : x; };
var FINE = window.matchMedia && window.matchMedia("(pointer: fine)").matches;
function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms || 10); } catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

/* ---------------- Motif léopard (généré) ---------------- */
function rng(seed){ return function(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function leopard(spot, center, seed){
  var S = 160, r = rng(seed), shapes = [], cells = 4, cs = S / cells, gx, gy, j;
  for (gy = 0; gy < cells; gy++) for (gx = 0; gx < cells; gx++){
    var cx = gx * cs + cs / 2 + (r() - .5) * cs * .55, cy = gy * cs + cs / 2 + (r() - .5) * cs * .55;
    var R = 8 + r() * 6, k = 3 + Math.floor(r() * 3), a0 = r() * Math.PI * 2;
    shapes.push({ c:center, x:cx, y:cy, rx:R * .78, ry:R * .62, rot:r() * 180 });
    for (j = 0; j < k; j++){
      var a = a0 + j * (2 * Math.PI / k) + (r() - .5) * .45;
      shapes.push({ c:spot, x:cx + Math.cos(a) * R, y:cy + Math.sin(a) * R, rx:R * (.5 + r() * .35), ry:R * (.2 + r() * .12), rot:a * 180 / Math.PI + 90 });
    }
  }
  for (j = 0; j < 12; j++) shapes.push({ c:spot, x:r() * S, y:r() * S, rx:1.4 + r() * 2.4, ry:1.1 + r() * 1.8, rot:r() * 180 });
  var out = "";
  shapes.forEach(function(sh){
    [-S, 0, S].forEach(function(dx){ [-S, 0, S].forEach(function(dy){
      var x = sh.x + dx, y = sh.y + dy;
      if (x < -24 || x > S + 24 || y < -24 || y > S + 24) return;
      out += "<ellipse cx='" + x.toFixed(1) + "' cy='" + y.toFixed(1) + "' rx='" + sh.rx.toFixed(1) + "' ry='" + sh.ry.toFixed(1) + "' transform='rotate(" + sh.rot.toFixed(0) + " " + x.toFixed(1) + " " + y.toFixed(1) + ")' fill='" + sh.c + "'/>";
    }); });
  });
  var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + S + "' height='" + S + "' viewBox='0 0 " + S + " " + S + "'>" + out + "</svg>";
  return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
}
var rootStyle = document.documentElement.style;
rootStyle.setProperty("--leo-gold", leopard("#E9C98F", "rgba(233,201,143,.28)", 21));
rootStyle.setProperty("--leo-text", leopard("#1E120C", "#C9955A", 42));

/* ---------------- Données ---------------- */
var PILLARS = { soin:"Soin de soi", mental:"Me construire", evoluer:"Évoluer" };
var FORMATS = ["One Girl, Many Lives", "Talk", "Confession / astuce"];
var THEMES = [
  { id:"confiance", name:"Confiance", pillar:"mental", size:"big", total:10, done:4,
    subs:["Oser se montrer sans filtre","Arrêter de se comparer","Parler devant les autres sans trembler","Ce que j’aurais aimé savoir sur la confiance","Se faire des compliments sans gêne"] },
  { id:"anglais", name:"Anglais", pillar:"evoluer", size:"small", total:9, done:3,
    subs:["Mes 5 expressions anglaises de la semaine","Comment j’apprends l’anglais seule","Je parle anglais pendant ma routine","Les erreurs des Français en anglais","Objectif C1 : mon point d’étape"] },
  { id:"beaute", name:"Beauté", pillar:"soin", size:"tall", total:10, done:6,
    subs:["Ma routine makeup en 10 minutes","Les produits qui valent vraiment leur prix","Prendre soin de sa peau mélanique","Mes erreurs beauté à éviter","Le makeup naturel du quotidien"] },
  { id:"jeunesse", name:"Jeunesse", pillar:"mental", size:"small", total:8, done:0,
    subs:["Ce que j’aurais voulu savoir à 20 ans","Profiter de sa jeunesse sans se perdre","Les erreurs qui font grandir","L’amitié à 20 ans","Arrêter de vouloir tout, tout de suite"] },
  { id:"femmes", name:"Femmes en évolution", pillar:"evoluer", size:"wide", total:9, done:4,
    subs:["Une journée avec moi","Étudiante, alternante et entrepreneuse","Les femmes qui m’inspirent","Grandir sans s’excuser","Lancer son business jeune"] },
  { id:"respect", name:"Respect de soi", pillar:"mental", size:"tall", total:8, done:2,
    subs:["Poser ses limites sans culpabiliser","Les relations qui ne te méritent pas","Se parler avec douceur","Savoir partir","Ta valeur ne dépend pas des autres"] },
  { id:"hygiene", name:"Hygiène", pillar:"soin", size:"small", total:8, done:2,
    subs:["Les gestes d’hygiène qu’on oublie","Sentir bon toute la journée","Prendre soin de ses mains et ongles","Ma routine du soir","Draps, serviettes : à quelle fréquence ?"] },
  { id:"objectifs", name:"Objectifs", pillar:"evoluer", size:"small", total:9, done:5,
    subs:["Comment je fixe mes objectifs du mois","Études, alternance et business : mon organisation","Rester motivée quand ça n’avance pas","Mon tableau de vision","Ce que j’ai accompli cette année"] },
  { id:"elegance", name:"Élégance", pillar:"soin", size:"wide", total:8, done:1,
    subs:["Être élégante avec un petit budget","Les basiques d’un dressing chic","Se tenir droite, ça change tout","Les codes de l’élégance au quotidien","Trouver son parfum signature"] },
  { id:"mental", name:"Cerveau et mental", pillar:"mental", size:"small", total:10, done:3,
    subs:["Gérer une journée trop chargée","Ce que la lecture a changé chez moi","Couper avec le négatif","Mes rituels pour une tête apaisée","Apprendre à dire non"] },
  { id:"communaute", name:"Communauté", pillar:"evoluer", size:"small", total:7, done:1,
    subs:["Je réponds à vos questions","Vos histoires, mes conseils","Le défi de la semaine ensemble","Merci d’être là","Ce que vous m’avez appris"] }
];
THEMES.forEach(function(t, ti){
  t.num = (ti + 1 < 10 ? "0" : "") + (ti + 1);
  var pub = Math.min(4, Math.round(t.done / t.total * 5));
  t.items = t.subs.map(function(title, i){
    return { title:title, format:FORMATS[(i + ti) % 3], status: i < pub ? "pub" : (i === pub ? "plan" : "todo") };
  });
  t.next = t.items[pub] ? t.items[pub].title : t.items[0].title;
});
var BY_ID = {}; THEMES.forEach(function(t){ BY_ID[t.id] = t; });
var STATUS_LABEL = { pub:"Publié", plan:"Planifié", todo:"À faire" };

/* ---------------- Salutation ---------------- */
var h = new Date().getHours();
var hello = h < 12 ? "Bonjour" : (h < 18 ? "Bon après-midi" : "Bonsoir");
$("#greet").textContent = hello;
$("#introHello").textContent = hello;

/* ---------------- Toast & confettis ---------------- */
var toastTimer;
function toast(msg){
  $("#toastText").textContent = msg;
  var el = $("#toast");
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2600);
}
var GOLD = ["#E9C98F","#C9A66B","#6E1423","#FBF3EA","#B02A44"];
function burstFrom(el, big){
  if (!window.confetti || RM) return;
  var r = el.getBoundingClientRect();
  window.confetti({
    particleCount: big ? 140 : 45, spread: big ? 95 : 60, startVelocity: big ? 42 : 28,
    scalar: big ? 1 : .8, ticks: 180, colors: GOLD, zIndex: 120,
    origin:{ x:(r.left + r.width / 2) / window.innerWidth, y:(r.top + r.height / 2) / window.innerHeight }
  });
}

/* ---------------- Grille ---------------- */
var grid = $("#grid");
function tileHTML(t){
  var big = t.size === "big", wide = t.size === "wide" || big;
  return '<span class="t-num" aria-hidden="true">' + t.num + '</span>' +
    '<span class="t-top"><span class="t-pillar">' + PILLARS[t.pillar] + '</span>' +
      (big ? '<span class="t-chip">' + t.done + '/' + t.total + ' traités</span>' : '') + '</span>' +
    '<span class="t-bottom">' +
      (wide ? '<span class="t-next">Prochain : ' + esc(t.next) + '</span>' : '') +
      '<span class="t-name">' + esc(t.name) + '</span></span>' +
    '<span class="t-arrow" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M8 7h9v9"/></svg></span>';
}
THEMES.forEach(function(t){
  var b = document.createElement("button");
  b.className = "tile grain art-" + t.pillar + " size-" + t.size;
  b.dataset.id = t.id;
  b.setAttribute("aria-label", "Ouvrir le thème " + t.name + ", " + t.done + " sujets traités sur " + t.total);
  b.innerHTML = tileHTML(t);
  grid.appendChild(b);
  bindTile(b, t);
});

function bindTile(b, t){
  b.addEventListener("pointermove", function(e){
    var r = b.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    b.style.setProperty("--mx", x + "px");
    b.style.setProperty("--my", y + "px");
    if (FINE && G && !RM && e.pointerType === "mouse"){
      G.to(b, { rotateY:(x / r.width - .5) * 9, rotateX:-(y / r.height - .5) * 9, transformPerspective:900, duration:.45, ease:"power2.out", overwrite:"auto" });
    }
  });
  b.addEventListener("pointerleave", function(){
    b.classList.remove("pressing");
    if (G) G.to(b, { rotateX:0, rotateY:0, duration:.6, ease:"elastic.out(1,.5)", overwrite:"auto" });
  });
  b.addEventListener("pointerdown", function(e){
    var r = b.getBoundingClientRect();
    b.style.setProperty("--mx", (e.clientX - r.left) + "px");
    b.style.setProperty("--my", (e.clientY - r.top) + "px");
    b.classList.add("pressing");
    if (G) G.to(b, { scale:.97, duration:.15, overwrite:"auto" });
  });
  b.addEventListener("pointerup", function(){
    b.classList.remove("pressing");
    if (G) G.to(b, { scale:1, duration:.4, ease:"back.out(2)", overwrite:"auto" });
  });
  b.addEventListener("click", function(){ buzz(8); openTheme(t, b); });
}

/* ---------------- Filtres & recherche ---------------- */
var filter = "all", query = "";
var pills = $$(".pill"), pillInd = $("#pillInd");
function moveInd(btn, animate){
  var props = { x: btn.offsetLeft, width: btn.offsetWidth };
  if (G && animate) G.to(pillInd, Object.assign({ duration:dur(.5), ease:"expo.out" }, props));
  else { pillInd.style.transform = "translateX(" + props.x + "px)"; pillInd.style.width = props.width + "px"; }
}
pills.forEach(function(p){
  p.addEventListener("click", function(){
    pills.forEach(function(o){ o.setAttribute("aria-pressed", String(o === p)); });
    filter = p.dataset.f;
    moveInd(p, true);
    buzz(6);
    applyFilter();
  });
});
window.addEventListener("resize", function(){ moveInd($('.pill[aria-pressed="true"]'), false); });

function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
function matches(t){
  if (filter !== "all" && t.pillar !== filter) return false;
  if (!query) return true;
  var q = norm(query);
  return norm(t.name).indexOf(q) > -1 || t.subs.some(function(s){ return norm(s).indexOf(q) > -1; });
}
function applyFilter(){
  var tiles = $$(".tile", grid);
  var state = HAS_FLIP && !RM ? window.Flip.getState(tiles) : null;
  var n = 0;
  tiles.forEach(function(el){
    var ok = matches(BY_ID[el.dataset.id]);
    el.style.display = ok ? "" : "none";
    if (ok) n++;
  });
  $("#empty").hidden = n > 0;
  $("#shown").textContent = n + (n > 1 ? " thèmes" : " thème");
  if (state){
    window.Flip.from(state, {
      duration:.65, ease:"power3.inOut", absolute:true, nested:true,
      onEnter:function(els){ return G.fromTo(els, { opacity:0, scale:.8 }, { opacity:1, scale:1, duration:.5, ease:"back.out(1.6)" }); },
      onLeave:function(els){ return G.to(els, { opacity:0, scale:.8, duration:.3 }); }
    });
  }
}
var qTimer;
$("#q").addEventListener("input", function(e){
  clearTimeout(qTimer);
  qTimer = setTimeout(function(){ query = e.target.value.trim(); applyFilter(); }, 140);
});

/* ---------------- Détail d'un thème (la tuile s'agrandit) ---------------- */
var detail = $("#detail"), current = null, currentTile = null;
function rectInset(el){
  var r = el.getBoundingClientRect();
  return "inset(" + r.top + "px " + (window.innerWidth - r.right) + "px " + (window.innerHeight - r.bottom) + "px " + r.left + "px round 26px)";
}
function renderList(t){
  $("#dList").innerHTML = t.items.map(function(it, i){
    var planned = it.status !== "todo";
    return '<article class="s-card">' +
      '<div class="s-chips"><span class="s-status st-' + it.status + '">' + STATUS_LABEL[it.status] + '</span><span class="s-format">' + it.format + '</span></div>' +
      '<h4 class="s-title">' + esc(it.title) + '</h4>' +
      '<div class="s-actions">' +
        '<button class="s-plan' + (planned ? ' done' : '') + '" data-i="' + i + '"' + (it.status === "pub" ? ' disabled' : '') + '>' +
          (it.status === "pub" ? "Déjà publié" : (planned ? "Planifié ✓" : "Planifier")) + '</button>' +
        '<button class="s-ai" data-i="' + i + '">Développer avec l’IA</button>' +
      '</div></article>';
  }).join("");
}
function openTheme(t, tile){
  current = t; currentTile = tile;
  detail.className = "detail grain art-" + t.pillar;
  $("#dNum").textContent = t.num;
  $("#dPillar").textContent = PILLARS[t.pillar];
  $("#dTitle").textContent = t.name;
  $("#dDone").textContent = t.done + " sur " + t.total + " sujets traités";
  var pct = Math.round(t.done / t.total * 100);
  $("#dPct").textContent = pct + " %";
  $("#dTotal").textContent = t.total + " au total";
  $("#dMore").textContent = "+ " + (t.total - t.items.length) + " autres sujets dans ce thème";
  renderList(t);
  detail.hidden = false;
  detail.scrollTop = 0;
  document.body.style.overflow = "hidden";
  var bar = $("#dBar");
  if (G && !RM){
    G.fromTo(detail, { clipPath: rectInset(tile) }, { clipPath:"inset(0px 0px 0px 0px round 0px)", duration:.8, ease:"expo.inOut", clearProps:"clipPath" });
    G.fromTo($$(".d-anim", detail), { y:40, opacity:0 }, { y:0, opacity:1, stagger:.07, delay:.45, duration:.7, ease:"power3.out" });
    G.fromTo($("#dNum"), { y:80, opacity:0 }, { y:0, opacity:1, delay:.35, duration:1.1, ease:"expo.out" });
    G.fromTo($(".d-sheet", detail), { y:120 }, { y:0, delay:.55, duration:.9, ease:"expo.out" });
    G.fromTo($$(".s-card", detail), { y:50, opacity:0 }, { y:0, opacity:1, stagger:.08, delay:.7, duration:.6, ease:"power3.out" });
    G.fromTo(bar, { width:"0%" }, { width:pct + "%", delay:.8, duration:1.2, ease:"power3.out" });
  } else {
    bar.style.width = pct + "%";
  }
  setTimeout(function(){ $("#dBack").focus({ preventScroll:true }); }, RM ? 0 : 500);
}
function closeTheme(){
  if (detail.hidden) return;
  var done = function(){
    detail.hidden = true;
    detail.style.clipPath = "";
    document.body.style.overflow = "";
    if (currentTile) currentTile.focus({ preventScroll:true });
  };
  if (G && !RM && currentTile){
    G.to($$(".d-anim, .d-sheet", detail), { opacity:0, y:20, duration:.25 });
    G.fromTo(detail, { clipPath:"inset(0px 0px 0px 0px round 0px)" }, { clipPath: rectInset(currentTile), duration:.7, ease:"expo.inOut", delay:.1,
      onComplete:function(){ G.set($$(".d-anim, .d-sheet", detail), { clearProps:"opacity,transform" }); done(); } });
  } else done();
}
$("#dBack").addEventListener("click", closeTheme);
$("#dAI").addEventListener("click", function(e){ buzz(10); toast("L’IA prépare de nouveaux sujets « " + current.name + " »…"); burstFrom(e.currentTarget, false); });
$("#dList").addEventListener("click", function(e){
  var btn = e.target.closest("button");
  if (!btn || !current) return;
  var it = current.items[+btn.dataset.i];
  if (btn.classList.contains("s-plan")){
    if (it.status === "todo"){
      it.status = "plan";
      btn.classList.add("done");
      btn.textContent = "Planifié ✓";
      var chip = btn.closest(".s-card").querySelector(".s-status");
      chip.className = "s-status st-plan"; chip.textContent = "Planifié";
      if (G && !RM) G.fromTo(chip, { scale:.6 }, { scale:1, duration:.5, ease:"back.out(3)" });
      burstFrom(btn, false); buzz(15);
      toast("« " + it.title + " » ajouté à ton planning");
    } else if (it.status === "plan"){
      toast("Déjà dans ton planning");
    }
  } else if (btn.classList.contains("s-ai")){
    buzz(8);
    toast("L’IA développe « " + it.title + " »…");
  }
});

/* ---------------- Paquet de cartes « Surprends-moi » ---------------- */
var deck = $("#deck"), stage = $("#stage"), actions = $("#deckActions"), hint = $("#deckHint");
var cards = [], drawn = null, busy = false;
for (var i = 0; i < 5; i++){
  var c = document.createElement("div");
  c.className = "card";
  c.innerHTML = '<div class="card-inner"><div class="face back grain"><span class="leo-frame"></span><span class="panel"></span><span class="mono">M</span><span class="brand">Manuella Content</span></div><div class="face front grain"></div></div>';
  stage.appendChild(c);
  cards.push(c);
}
var top = cards[cards.length - 1];
function allSubjects(){
  var all = [];
  THEMES.forEach(function(t){ t.items.forEach(function(it){ all.push({ t:t, it:it }); }); });
  return all;
}
function pick(){
  var all = allSubjects(), x, guard = 0;
  do { x = all[Math.floor(Math.random() * all.length)]; guard++; } while (drawn && x.it === drawn.it && guard < 12);
  return x;
}
function fillFront(s){
  var f = $(".front", top);
  f.className = "face front grain art-" + s.t.pillar;
  f.innerHTML = '<span class="t-num" aria-hidden="true">' + s.t.num + '</span>' +
    '<div><div class="f-label">Ton sujet du jour</div><div class="f-theme">' + PILLARS[s.t.pillar] + ' · ' + esc(s.t.name) + '</div></div>' +
    '<h3 class="f-title">' + esc(s.it.title) + '</h3>' +
    '<span class="f-format">' + s.it.format + '</span>';
}
function shuffleInto(tl){
  for (var k = 0; k < 3; k++){
    (function(k){
      tl.to(cards.filter(function(_, i){ return i % 2 === 0; }), { x:-118, rotation:-14, y:-6, duration:.2, ease:"power2.out" })
        .to(cards.filter(function(_, i){ return i % 2 === 1; }), { x:118, rotation:14, y:6, duration:.2, ease:"power2.out" }, "<")
        .add(function(){ cards.forEach(function(c, i){ c.style.zIndex = ((i + k) % 2 ? 10 : 20) + i; }); })
        .to(cards, { x:0, y:0, rotation:function(i){ return (i - 2) * 2.5; }, duration:.2, ease:"power2.in" });
    })(k);
  }
  tl.add(function(){ cards.forEach(function(c, i){ c.style.zIndex = 10 + i; }); top.style.zIndex = 60; });
}
function reveal(tl){
  drawn = pick();
  tl.add(function(){ fillFront(drawn); hint.textContent = "Et ton sujet est…"; })
    .to(top, { y:-12, scale:1.05, rotation:0, duration:.3, ease:"power2.out" })
    .to($(".card-inner", top), { rotateY:180, duration:.85, ease:"back.out(1.3)" })
    .add(function(){ hint.textContent = "Le hasard a bien choisi."; burstFrom(top, false); buzz(20); }, "-=.35")
    .to(actions, { autoAlpha:1, y:0, duration:.4, ease:"power3.out" }, "-=.2")
    .add(function(){ busy = false; $("#take").focus({ preventScroll:true }); });
}
function openDeck(){
  if (busy) return;
  busy = true;
  deck.hidden = false;
  document.body.style.overflow = "hidden";
  hint.textContent = "Je mélange…";
  if (!G || RM){
    drawn = pick(); fillFront(drawn);
    $(".card-inner", top).style.transform = "rotateY(180deg)";
    actions.style.opacity = 1; actions.style.visibility = "visible";
    hint.textContent = "Et ton sujet est…";
    busy = false; return;
  }
  G.set($(".card-inner", top), { rotateY:0 });
  G.set(actions, { autoAlpha:0, y:20 });
  G.set(cards, { x:0, y:window.innerHeight * .6, scale:1, opacity:0, rotation:function(i){ return (i - 2) * 6; } });
  var tl = G.timeline();
  tl.fromTo(deck, { opacity:0 }, { opacity:1, duration:.3 })
    .to(cards, { y:0, opacity:1, rotation:function(i){ return (i - 2) * 2.5; }, stagger:.06, duration:.6, ease:"back.out(1.4)" }, "-=.1");
  shuffleInto(tl);
  reveal(tl);
}
function again(){
  if (busy || !G || RM){ if (!G || RM){ drawn = pick(); fillFront(drawn); } return; }
  busy = true;
  hint.textContent = "Je remélange…";
  var tl = G.timeline();
  tl.to(actions, { autoAlpha:0, y:20, duration:.25 })
    .to($(".card-inner", top), { rotateY:0, duration:.5, ease:"power2.inOut" }, "<")
    .to(top, { y:0, scale:1, duration:.3 }, "<");
  shuffleInto(tl);
  reveal(tl);
}
function closeDeck(){
  var end = function(){ deck.hidden = true; document.body.style.overflow = ""; busy = false; $("#surprise").focus({ preventScroll:true }); };
  if (G && !RM) G.to(deck, { opacity:0, duration:.3, onComplete:function(){ G.set(deck, { opacity:1 }); end(); } });
  else end();
}
function take(){
  if (busy || !drawn) return;
  busy = true;
  var s = drawn;
  if (s.it.status === "todo") s.it.status = "plan";
  burstFrom(top, true); buzz(30);
  if (G && !RM){
    G.timeline()
      .to(actions, { autoAlpha:0, duration:.2 })
      .to(top, { y:-window.innerHeight * .7, rotation:10, scale:.4, opacity:0, duration:.7, ease:"power3.in" }, "<.1")
      .to(cards.slice(0, -1), { opacity:0, y:60, stagger:.04, duration:.3 }, "<")
      .add(function(){ G.set(top, { opacity:1 }); closeDeck(); toast("« " + s.it.title + " » ajouté à ton planning"); });
  } else { closeDeck(); toast("« " + s.it.title + " » ajouté à ton planning"); }
}
$("#surprise").addEventListener("click", function(){ buzz(10); openDeck(); });
$("#again").addEventListener("click", again);
$("#take").addEventListener("click", take);
$("#deckClose").addEventListener("click", function(){ if (!busy) closeDeck(); });

document.addEventListener("keydown", function(e){
  if (e.key !== "Escape") return;
  if (!deck.hidden && !busy) closeDeck();
  else if (!detail.hidden) closeTheme();
});

/* ---------------- Boutons secondaires ---------------- */
$$(".nav [data-soon]").forEach(function(b){ b.addEventListener("click", function(){ buzz(6); toast("Cet écran arrive dans la prochaine maquette"); }); });
$("#bell").addEventListener("click", function(e){ toast("2 idées vocales attendent d’être transformées en sujets"); if (G && !RM) G.fromTo(e.currentTarget, { rotation:-18 }, { rotation:0, duration:.8, ease:"elastic.out(1.2,.3)" }); });

/* ---------------- Poussière dorée ---------------- */
(function dust(){
  if (RM) return;
  var cv = $("#dust"), ctx = cv.getContext("2d"), W, H, dpr, parts = [];
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size(); window.addEventListener("resize", size);
  var count = W < 700 ? 28 : 55;
  for (var i = 0; i < count; i++){
    parts.push({ x:Math.random() * W, y:Math.random() * H, r:Math.random() * 1.6 + .4, v:Math.random() * .25 + .08, p:Math.random() * Math.PI * 2, a:Math.random() * .5 + .2 });
  }
  var running = true;
  document.addEventListener("visibilitychange", function(){ running = !document.hidden; if (running) requestAnimationFrame(loop); });
  function loop(t){
    if (!running) return;
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < parts.length; i++){
      var p = parts[i];
      p.y -= p.v; p.x += Math.sin(t / 2000 + p.p) * .2;
      if (p.y < -5){ p.y = H + 5; p.x = Math.random() * W; }
      ctx.beginPath();
      ctx.fillStyle = "rgba(201,166,107," + (p.a * (.6 + .4 * Math.sin(t / 700 + p.p))) + ")";
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

/* ---------------- Intro + révélation de la page ---------------- */
function splitLetters(el){
  var txt = el.textContent;
  el.setAttribute("aria-label", txt);
  el.innerHTML = txt.split("").map(function(ch){
    return '<span class="mask" aria-hidden="true"><span class="ch">' + (ch === " " ? "&nbsp;" : esc(ch)) + '</span></span>';
  }).join("");
}
$$("[data-split]").forEach(splitLetters);
splitLetters($("#introName"));
moveInd($('.pill[aria-pressed="true"]'), false);

var intro = $("#intro");
var revealTl = null;
function buildReveal(){
  var tl = G.timeline({ paused:true });
  tl.from($$("#title .ch"), { yPercent:115, rotate:6, stagger:.035, duration:.9, ease:"expo.out" })
    .from($$(".top > *"), { y:-20, opacity:0, stagger:.08, duration:.6, ease:"power3.out" }, "<")
    .from($$(".reveal"), { y:26, opacity:0, stagger:.08, duration:.7, ease:"power3.out" }, "-=.6")
    .from($$(".tile", grid), { y:70, opacity:0, rotateX:-18, transformPerspective:900, stagger:.06, duration:.9, ease:"expo.out", clearProps:"transform,opacity" }, "-=.5")
    .from(".nav", { y:120, duration:.8, ease:"expo.out" }, "-=.9");
  return tl;
}
function revealPage(){
  if (!revealTl) return;
  revealTl.play();
  var obj = { v:0 };
  G.to(obj, { v:96, duration:1.6, delay:.5, ease:"power2.out", onUpdate:function(){ $("#count").textContent = Math.round(obj.v); } });
}
var introDone = false;
function endIntro(){
  if (introDone) return;
  introDone = true;
  if (G && !RM){
    G.killTweensOf($$("#intro *"));
    G.to(intro, { yPercent:-100, duration:.9, ease:"expo.inOut", onComplete:function(){ intro.remove(); } });
    setTimeout(revealPage, 350);
  } else { intro.remove(); }
}
$("#introSkip").addEventListener("click", endIntro);
if (!G || RM){
  intro.remove();
} else {
  revealTl = buildReveal();
  var it = G.timeline({ onComplete:function(){ setTimeout(endIntro, 450); } });
  it.from("#intro .ring", { scale:0, rotate:-120, duration:.9, ease:"back.out(1.6)" })
    .from("#introHello", { y:16, opacity:0, duration:.5, ease:"power3.out" }, "-=.3")
    .from($$("#introName .ch"), { yPercent:115, stagger:.05, duration:.8, ease:"expo.out" }, "-=.2")
    .from("#introSub", { y:14, opacity:0, duration:.5, ease:"power3.out" }, "-=.4")
    .from("#introSkip", { opacity:0, duration:.4 }, "<");
}
})();
</script>
